name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build multimon-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
          git clone --depth 1 --branch 1.6.1 https://github.com/EliasOenal/multimon-ng.git multimon-ng-source
          cmake -S multimon-ng-source -B multimon-ng-source/build -DPULSE_AUDIO_SUPPORT=OFF -DX11_SUPPORT=OFF -DSDL3_SCOPE=OFF -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build multimon-ng-source/build --parallel
      - name: Run decoder smoke test
        run: |
          : > empty.raw
          multimon-ng-source/build/multimon-ng -t raw -a POCSAG512 empty.raw

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: The manifest is valid
        run: |
          cargo run --locked --quiet -- --describe > manifest.json
          python3 .github/check_manifest.py manifest.json

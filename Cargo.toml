[package]
name = "trunk-plugin-multimon-capture"
version = "0.1.0"
edition = "2024"
description = "Captures Trunk Recorder Pro FM discriminator taps as raw audio for pager decoders such as multimon-ng."
license = "GPL-3.0-or-later"
repository = "https://github.com/steve-horvath/trunk-plugin-multimon-capture"
authors = ["Steve Horvath"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.17.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
